services:
  bridge:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/bridge.db
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in .env}
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:?Set GITHUB_ALLOWED_REPOS in .env}
      GITHUB_READY_LABEL: ${GITHUB_READY_LABEL:-agent:ready}
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
    volumes:
      - bridge-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  bridge-data:

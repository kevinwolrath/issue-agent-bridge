name: Deploy Issue Agent Bridge

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  packages: read

concurrency:
  group: issue-agent-bridge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop')
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy containers locally on Windows Docker host
        shell: powershell
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.ISSUE_AGENT_BRIDGE_WEBHOOK_SECRET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          ALLOWED_REPOS: ${{ vars.ALLOWED_REPOS }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('GITHUB_WEBHOOK_SECRET', 'CLOUDFLARE_TUNNEL_TOKEN', 'ALLOWED_REPOS')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required GitHub secret or variable: $name"
            }
          }
          docker info --format '{{.OSType}}' | ForEach-Object {
            if ($_ -ne 'linux') { throw 'Docker must be running Linux containers.' }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Docker daemon is unavailable.' }
          docker compose -f compose.deploy.yaml config --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Compose configuration.' }
          docker compose -f compose.deploy.yaml pull
          if ($LASTEXITCODE -ne 0) { throw 'Docker image pull failed.' }
          docker compose -f compose.deploy.yaml up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) { throw 'Docker deployment failed.' }
          docker compose -f compose.deploy.yaml ps
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect deployed containers.' }

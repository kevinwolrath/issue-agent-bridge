name: Go and Docker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: docker compose build
        env:
          GITHUB_WEBHOOK_SECRET: ci-placeholder
          GITHUB_ALLOWED_REPOS: example/project

# Runs prebuilt images only. Credentials are injected by the deployment workflow;
# no .env file or persistent credential file is required on the Docker host.
name: issue-agent-bridge

services:
  bridge:
    image: ghcr.io/kevinwolrath/issue-agent-bridge:${BRIDGE_IMAGE_TAG:-develop}
    init: true
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: /data/bridge.db
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Required}
      GITHUB_ALLOWED_REPOS: ${ALLOWED_REPOS:?Required}
      GITHUB_READY_LABEL: agent:ready
      WORKER_ENABLED: "false"
    volumes:
      - bridge-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Required}
    depends_on:
      bridge:
        condition: service_healthy

volumes:
  bridge-data:
